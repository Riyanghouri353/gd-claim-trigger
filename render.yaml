services:
  - type: web
    name: gd-claim-trigger
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Encrypted wallet vault (Supabase). Keys are AES-256-GCM ciphertext;
      # only PROJECT_KEY (below) can decrypt them.
      - key: SUPABASE_URL
        value: "https://jmayjkfhmjqcxzsjyzyw.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false # Render prompts at deploy time — service_role key, keep secret
      - key: PROJECT_KEY
        sync: false # Render prompts at deploy time — 64-hex encryption key, keep secret
      - key: CHAINS
        value: "celo,xdc,fuse"
      - key: GD_CLAIM_URL
        value: "https://uiwsjxfcdruvqnbgdwdd.supabase.co/functions/v1/gd-claim"
      - key: CLAIM_TIME_UTC
        value: "18:00"
